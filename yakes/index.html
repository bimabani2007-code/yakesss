<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untuk Kamu YAKESSSSS</title>

<!-- ============================================================
     GOOGLE FONTS — Cormorant Garamond (judul) & Poppins (isi)
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ====================================================================
   0. RESET & VARIABLES
   ==================================================================== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --deep:#050816;
  --mid:#0f172a;
  --white:#ffffff;
  --soft:#e2e8f0;
  --muted:#cbd5e1;
  --glow:rgba(255,255,255,.85);
  --font-title:'Cormorant Garamond', serif;
  --font-body:'Poppins', sans-serif;
}
html,body{
  width:100%;height:100%;
  overflow:hidden; /* tidak memakai scroll */
  background:var(--deep);
  font-family:var(--font-body);
  color:var(--soft);
  cursor:default;
  -webkit-font-smoothing:antialiased;
}
button{font-family:var(--font-body);border:none;background:none;cursor:pointer;}

/* ====================================================================
   1. BACKGROUND CANVAS (ribuan bintang kecil, ambient)
   ==================================================================== */
#bg-stars{
  position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 50% 0%, var(--mid) 0%, var(--deep) 70%);
}

/* ====================================================================
   2. AURORA — wisps tipis berwarna putih lembut
   ==================================================================== */
#aurora{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none;mix-blend-mode:screen;}
.aurora-band{
  position:absolute;
  width:140%;height:60%;
  left:-20%;
  background:linear-gradient(120deg, transparent 10%, rgba(226,232,240,.10) 35%, rgba(255,255,255,.16) 50%, rgba(226,232,240,.10) 65%, transparent 90%);
  filter:blur(40px);
  border-radius:50%;
  opacity:.55;
  animation:auroraDrift 26s ease-in-out infinite;
}
.aurora-band.b2{top:-8%; animation-duration:32s; opacity:.35; transform:rotate(-4deg);}
.aurora-band.b3{top:18%; animation-duration:40s; opacity:.25; transform:rotate(3deg);}
@keyframes auroraDrift{
  0%{transform:translateX(-4%) translateY(0) scaleX(1);}
  50%{transform:translateX(4%) translateY(2%) scaleX(1.08);}
  100%{transform:translateX(-4%) translateY(0) scaleX(1);}
}

/* ====================================================================
   3. SUNRISE OVERLAY (muncul saat ending)
   ==================================================================== */
#sunrise-overlay{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%, rgba(255,244,224,.55) 0%, rgba(226,232,240,.28) 35%, rgba(15,23,42,0) 70%);
  opacity:0;
  transition:opacity 4500ms ease;
}
#sunrise-overlay.visible{opacity:1;}

/* ====================================================================
   4. AMBIENT PARTICLES (kabut & partikel putih)
   ==================================================================== */
#particle-layer{position:fixed;inset:0;z-index:3;overflow:hidden;pointer-events:none;}
.particle{
  position:absolute;bottom:-10px;
  width:3px;height:3px;border-radius:50%;
  background:var(--white);
  opacity:.5;
  filter:blur(.5px);
  animation:floatUp linear infinite;
}
@keyframes floatUp{
  0%{transform:translate(0,0) scale(1);opacity:0;}
  10%{opacity:.6;}
  90%{opacity:.3;}
  100%{transform:translate(var(--drift,20px), -110vh) scale(.4);opacity:0;}
}

/* shooting star */
.shooting-star{
  position:fixed;z-index:3;
  width:2px;height:2px;border-radius:50%;
  background:var(--white);
  box-shadow:0 0 6px 1px rgba(255,255,255,.9);
  pointer-events:none;
}
.shooting-star::before{
  content:'';position:absolute;top:50%;right:0;
  width:90px;height:1px;
  background:linear-gradient(90deg, rgba(255,255,255,.9), transparent);
  transform:translateY(-50%);
}

/* ====================================================================
   5. CURSOR GLOW & RIPPLE
   ==================================================================== */
#cursor-glow{
  position:fixed;top:0;left:0;z-index:5;
  width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.07) 0%, transparent 70%);
  transform:translate(-50%,-50%);
  pointer-events:none;
  transition:opacity .4s ease;
  opacity:0;
}
#ripple-layer{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden;}
.ripple{
  position:absolute;
  width:10px;height:10px;border-radius:50%;
  border:1px solid rgba(255,255,255,.5);
  transform:translate(-50%,-50%);
  animation:rippleOut 900ms ease-out forwards;
}
@keyframes rippleOut{
  0%{width:10px;height:10px;opacity:.6;}
  100%{width:140px;height:140px;opacity:0;}
}

/* ====================================================================
   6. SKY LAYER — bintang interaktif & ikon kenangan (💝)
   ==================================================================== */
#sky-layer{position:fixed;inset:0;z-index:4;pointer-events:none;}
#sky-layer.interactive{pointer-events:auto;}

.star-pt{
  position:absolute;
  width:10px;height:10px;
  transform:translate(-50%,-50%);
  cursor:pointer;
  pointer-events:auto;
}
.star-pt::before{
  content:'';position:absolute;inset:0;
  margin:auto;width:5px;height:5px;border-radius:50%;
  left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--white);
  box-shadow:0 0 8px 2px rgba(255,255,255,.85), 0 0 16px 6px rgba(226,232,240,.35);
  animation:twinkle 2.6s ease-in-out infinite;
}
.star-pt:hover::before{box-shadow:0 0 14px 4px rgba(255,255,255,1), 0 0 28px 10px rgba(226,232,240,.6);}
.star-pt.opened::before{
  animation:none;
  background:var(--soft);
  box-shadow:0 0 6px 1px rgba(226,232,240,.5);
  opacity:.55;
}
@keyframes twinkle{
  0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1);}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.35);}
}

.heart-pt{
  position:absolute;
  font-size:22px;
  line-height:1;
  transform:translate(-50%,-50%);
  cursor:pointer;
  pointer-events:auto;
  color:var(--white);
  filter:drop-shadow(0 0 6px rgba(255,255,255,.65)) drop-shadow(0 0 14px rgba(255,255,255,.3));
  animation:heartbeat 3.4s ease-in-out infinite, bob 5s ease-in-out infinite;
  transition:filter .35s ease, transform .35s ease;
  user-select:none;
}
.heart-pt:hover{
  filter:drop-shadow(0 0 12px rgba(255,255,255,.95)) drop-shadow(0 0 24px rgba(255,255,255,.55));
  transform:translate(-50%,-50%) scale(1.18);
}
.heart-pt.opened{
  opacity:.4;
  filter:drop-shadow(0 0 4px rgba(255,255,255,.3));
  animation:bob 5s ease-in-out infinite;
}
@keyframes heartbeat{
  0%,100%{transform:translate(-50%,-50%) scale(1);}
  15%{transform:translate(-50%,-50%) scale(1.18);}
  30%{transform:translate(-50%,-50%) scale(1);}
}
@keyframes bob{
  0%,100%{margin-top:0px;}
  50%{margin-top:-10px;}
}

/* glow burst when star is opened */
.glow-burst{
  position:fixed;z-index:4;
  width:6px;height:6px;border-radius:50%;
  background:transparent;
  box-shadow:0 0 0 0 rgba(255,255,255,.8);
  transform:translate(-50%,-50%);
  pointer-events:none;
  animation:burst 700ms ease-out forwards;
}
@keyframes burst{
  0%{box-shadow:0 0 0 0 rgba(255,255,255,.7);opacity:1;}
  100%{box-shadow:0 0 0 60px rgba(255,255,255,0);opacity:0;}
}

/* birds for ending */
.bird{
  position:fixed;z-index:3;color:rgba(255,255,255,.85);
  font-size:14px;pointer-events:none;
  animation:flyAcross linear forwards;
  text-shadow:0 0 6px rgba(255,255,255,.4);
}
@keyframes flyAcross{
  0%{transform:translate(-10vw, 0) scale(.8);opacity:0;}
  10%{opacity:1;}
  90%{opacity:1;}
  100%{transform:translate(120vw, -12vh) scale(1.1);opacity:0;}
}

/* ====================================================================
   7. PROGRESS BAR
   ==================================================================== */
#progress-bar{
  position:fixed;left:50%;bottom:26px;z-index:7;
  transform:translate(-50%,12px);
  display:flex;gap:26px;
  font-size:.72rem;letter-spacing:.06em;
  color:var(--muted);
  opacity:0;
  transition:opacity 1s ease, transform 1s ease;
  text-align:center;
  pointer-events:none;
}
#progress-bar.visible{opacity:1;transform:translate(-50%,0);}
.progress-item{display:flex;flex-direction:column;gap:3px;}
.progress-item span.label{font-weight:300;opacity:.8;}
.progress-item span.count{font-family:var(--font-title);font-size:1rem;color:var(--soft);letter-spacing:.04em;}

/* ====================================================================
   8. HINT TEXT
   ==================================================================== */
#hint-text{
  position:fixed;top:30px;left:50%;z-index:7;
  transform:translate(-50%,-10px);
  font-size:.85rem;letter-spacing:.05em;
  color:var(--muted);
  opacity:0;
  transition:opacity 1.2s ease, transform 1.2s ease;
  pointer-events:none;
  text-align:center;
  width:90%;
}
#hint-text.visible{opacity:1;transform:translate(-50%,0);}

/* ====================================================================
   9. OVERLAY SCRIM & SEQUENCE TEXT (narasi)
   ==================================================================== */
#overlay-scrim{
  position:fixed;inset:0;z-index:8;
  background:radial-gradient(ellipse at 50% 50%, rgba(5,8,22,.35) 0%, rgba(5,8,22,.72) 100%);
  opacity:1;
  transition:opacity 1.6s ease;
  pointer-events:none;
}
#overlay-scrim.hidden{opacity:0;}

#sequence-text{
  position:fixed;top:50%;left:50%;z-index:8;
  transform:translate(-50%,-50%);
  width:88%;max-width:640px;
  text-align:center;
  font-family:var(--font-title);
  font-weight:400;
  font-size:clamp(1.5rem, 4vw, 2.4rem);
  line-height:1.5;
  color:var(--white);
  text-shadow:0 4px 30px rgba(0,0,0,.55);
  opacity:0;
  pointer-events:none;
}

#start-btn{
  position:fixed;left:50%;bottom:16%;z-index:8;
  transform:translate(-50%,18px);
  padding:14px 46px;
  font-family:var(--font-body);
  font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--white);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.35);
  border-radius:40px;
  backdrop-filter:blur(8px);
  opacity:0;
  pointer-events:none;
  transition:opacity 1s ease, transform 1s ease, background .3s ease, letter-spacing .3s ease;
}
#start-btn.visible{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
#start-btn:hover{background:rgba(255,255,255,.14);letter-spacing:.22em;}

/* ====================================================================
   10. GLASS CARD — pesan bintang
   ==================================================================== */
#card-message{
  position:fixed;inset:0;z-index:9;
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;
  transition:opacity .5s ease;
  background:rgba(5,8,22,.45);
  backdrop-filter:blur(2px);
}
#card-message.visible{opacity:1;visibility:visible;}
.glass-card{
  width:86%;max-width:420px;
  padding:46px 34px 36px;
  border-radius:22px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(18px);
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  text-align:center;
  transform:scale(.85) translateY(16px);
  opacity:0;
  transition:transform .55s cubic-bezier(.22,1,.36,1), opacity .55s ease;
}
#card-message.visible .glass-card{transform:scale(1) translateY(0);opacity:1;}
.glass-card .star-icon{font-size:1.4rem;display:block;margin-bottom:18px;opacity:.9;}
.glass-card p{
  font-family:var(--font-title);
  font-size:clamp(1.15rem,3.4vw,1.5rem);
  line-height:1.65;
  color:var(--white);
  margin-bottom:10px;
  opacity:0;
  animation:lineIn .7s ease forwards;
}
.glass-card .close-btn{
  margin-top:24px;
  font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);
  padding:10px 28px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:30px;
  background:transparent;
  transition:.3s;
}
.glass-card .close-btn:hover{background:rgba(255,255,255,.08);color:var(--white);}
@keyframes lineIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ====================================================================
   11. POLAROID CARD — kenangan foto
   ==================================================================== */
#card-polaroid{
  position:fixed;inset:0;z-index:9;
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;
  background:rgba(5,8,22,.55);
  backdrop-filter:blur(6px);
  transition:opacity .6s ease, backdrop-filter .6s ease;
}
#card-polaroid.visible{opacity:1;visibility:visible;}
.polaroid{
  width:80%;max-width:340px;
  padding:18px 18px 26px;
  background:rgba(255,255,255,.92);
  border-radius:10px;
  box-shadow:0 30px 70px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.25);
  text-align:center;
  transform:scale(.8) rotate(-4deg);
  filter:blur(8px);
  opacity:0;
  transition:transform .7s cubic-bezier(.22,1,.36,1), filter .7s ease, opacity .6s ease;
}
#card-polaroid.visible .polaroid{transform:scale(1) rotate(-1.2deg);filter:blur(0);opacity:1;}
.polaroid .photo-wrap{
  width:100%;aspect-ratio:1/1;
  background:linear-gradient(135deg,#e9edf3,#d8dee8);
  border-radius:4px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  color:#94a3b8;font-size:1.8rem;
}
.polaroid img{width:100%;height:100%;object-fit:cover;display:block;}
.polaroid p.caption{
  margin-top:16px;
  font-family:var(--font-title);
  font-style:italic;
  font-size:1.02rem;
  color:#1e293b;
  line-height:1.5;
  padding:0 4px;
}
.polaroid .close-btn{
  margin-top:18px;
  font-family:var(--font-body);
  font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:#475569;
  padding:9px 26px;
  border:1px solid #cbd5e1;
  border-radius:30px;
  background:transparent;
  transition:.3s;
}
.polaroid .close-btn:hover{background:#f1f5f9;}

/* ====================================================================
   12. FINAL ICON (akhir cerita)
   ==================================================================== */
#final-icon{
  position:fixed;left:50%;bottom:14%;z-index:8;
  transform:translate(-50%,14px);
  font-size:1.8rem;
  opacity:0;pointer-events:none;
  transition:opacity 1.4s ease, transform 1.4s ease;
  filter:drop-shadow(0 0 12px rgba(255,255,255,.5));
  animation:heartbeat 3.4s ease-in-out infinite;
}
#final-icon.visible{opacity:1;transform:translate(-50%,0);pointer-events:auto;}

/* ====================================================================
   13. RESPONSIVE
   ==================================================================== */
@media (max-width:600px){
  #sequence-text{font-size:clamp(1.25rem,5.6vw,1.9rem);width:92%;}
  #start-btn{font-size:.75rem;padding:12px 36px;bottom:14%;}
  .glass-card{padding:38px 24px 30px;}
  #progress-bar{gap:16px;font-size:.62rem;bottom:18px;}
  .heart-pt{font-size:19px;}
  #hint-text{font-size:.75rem;top:20px;}
}

/* honor reduced motion preference */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.2s !important;}
}
</style>
</head>
<body>

<!-- background layers -->
<canvas id="bg-stars"></canvas>
<div id="aurora">
  <div class="aurora-band"></div>
  <div class="aurora-band b2"></div>
  <div class="aurora-band b3"></div>
</div>
<div id="sunrise-overlay"></div>
<div id="particle-layer"></div>

<!-- interactive sky: bintang & kenangan -->
<div id="sky-layer"></div>

<!-- cursor & ripple -->
<div id="cursor-glow"></div>
<div id="ripple-layer"></div>

<!-- progress -->
<div id="progress-bar">
  <div class="progress-item">
    <span class="label">Bintang yang ditemukan</span>
    <span class="count" id="star-progress">0 / 0</span>
  </div>
  <div class="progress-item">
    <span class="label">💝 Kenangan ditemukan</span>
    <span class="count" id="heart-progress">0 / 0</span>
  </div>
</div>

<!-- hint -->
<div id="hint-text"></div>

<!-- narrative overlay -->
<div id="overlay-scrim"></div>
<div id="sequence-text"></div>
<button id="start-btn">Mulai</button>

<!-- star message card -->
<div id="card-message">
  <div class="glass-card" id="glass-card-inner">
    <span class="star-icon">🌟</span>
    <div id="message-lines"></div>
    <button class="close-btn" id="close-message">Tutup</button>
  </div>
</div>

<!-- photo memory card -->
<div id="card-polaroid">
  <div class="polaroid" id="polaroid-inner">
    <div class="photo-wrap" id="photo-wrap">📷</div>
    <p class="caption" id="photo-caption"></p>
    <button class="close-btn" id="close-photo">Tutup</button>
  </div>
</div>

<!-- final icon -->
<button id="final-icon">🤍</button>

<script>
/* ====================================================================
   DATA — pesan bintang & kenangan foto
   (silakan ganti / tambah sesuai kebutuhan)
   ==================================================================== */

// Setiap pesan adalah array baris (1-2 baris singkat)
const STAR_MESSAGES = [
  ["Makasih ya."],
  ["Aku mungkin nggak sering bilang.", "Tapi kehadiran kamu selalu bikin hariku lebih ringan."],
  ["Tingkah random kamu...", "...sering jadi alasan aku ketawa."],
  ["Aku harap...", "Kamu selalu sehat."],
  ["Semoga semua yang sedang kamu perjuangkan berhasil."],
  ["Semoga langkahmu selalu dipermudah."],
  ["Semoga rezekimu selalu dilancarkan."],
  ["Semoga kamu selalu dikelilingi orang-orang yang tulus."],
  ["Kalau nanti aku agak menghilang...", "Bukan karena aku menjauh."],
  ["Aku cuma sedang menyelesaikan beberapa hal."],
  ["Terima kasih...", "Karena pernah hadir."],
  ["Aku selalu mendoakan yang terbaik buat kamu."],
  ["Jangan lupa jaga diri ya."],
  ["Kalau lagi capek...", "Ingat buat istirahat."],
  ["Semoga senyum kamu nggak pernah hilang."],
  ["Kamu pantas mendapatkan banyak hal baik."]
];

// Ganti file di folder images/ sesuai kebutuhanmu
const memories = [
  { image: "images/foto1.jpeg", caption: "Kalau diputar ulang, rasanya masih sama hangatnya." },
  { image: "images/foto2.jpeg", caption: "Kalau suatu hari nanti lupa tanggalnya, semoga tidak lupa rasanya." },
  { image: "images/foto3.jpeg", caption: "Beberapa momen memang terlalu indah untuk dilupakan." },
  { image: "images/foto4.jpeg", caption: "Momen kecil yang diam-diam aku simpan baik-baik." },
  { image: "images/foto5.jpeg", caption: "Iya kamu cantik kok walaupun pendek haha." },
  { image: "images/foto6.jpeg", caption: "Satu foto, banyak cerita yang nggak sempat diucapkan." },
  { image: "images/foto7.jpeg", caption: "Terima kasih sudah mau ada di banyak momen ini." },
  { image: "images/foto8.jpeg", caption: "Semoga ke depannya ada lebih banyak momen seperti ini." }
];

/* ====================================================================
   STATE
   ==================================================================== */
const totalStars = STAR_MESSAGES.length;
const totalHearts = memories.length;
const openedStars = new Set();
const openedHearts = new Set();
let endingTriggered = false;
let heartsSequenceShown = false;
let sequenceQueue = Promise.resolve();

const $ = (id) => document.getElementById(id);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* ====================================================================
   1. BACKGROUND CANVAS STARS (ambient, ribuan bintang kecil)
   ==================================================================== */
function setupCanvasStars() {
  const canvas = $("bg-stars");
  const ctx = canvas.getContext("2d");
  let w, h, stars;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    const count = Math.floor((w * h) / 3200); // density relatif terhadap ukuran layar
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.2 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.015 + 0.005
    }));
  }
  resize();
  window.addEventListener("resize", resize);

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      s.phase += s.speed;
      const op = 0.35 + Math.abs(Math.sin(s.phase)) * 0.55;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${op})`;
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
}

/* ====================================================================
   2. AMBIENT PARTICLES (partikel putih melayang)
   ==================================================================== */
function setupParticles(count = 36) {
  const layer = $("particle-layer");
  for (let i = 0; i < count; i++) spawnParticle(layer, true);
}
function spawnParticle(layer, ambient) {
  const p = document.createElement("div");
  p.className = "particle";
  const left = Math.random() * 100;
  const duration = 9 + Math.random() * 10;
  const delay = ambient ? Math.random() * duration : 0;
  const drift = (Math.random() * 60 - 30) + "px";
  p.style.left = left + "vw";
  p.style.setProperty("--drift", drift);
  p.style.animationDuration = duration + "s";
  p.style.animationDelay = "-" + delay + "s";
  layer.appendChild(p);
  if (!ambient) setTimeout(() => p.remove(), (duration + 1) * 1000);
}
// burst partikel besar (dipakai di akhir cerita)
function particleBurst(amount = 90) {
  const layer = $("particle-layer");
  for (let i = 0; i < amount; i++) {
    setTimeout(() => spawnParticle(layer, false), i * 18);
  }
}

/* ====================================================================
   3. SHOOTING STAR (acak)
   ==================================================================== */
function spawnShootingStar() {
  const el = document.createElement("div");
  el.className = "shooting-star";
  const startX = Math.random() * window.innerWidth * 0.6 + window.innerWidth * 0.2;
  const startY = Math.random() * window.innerHeight * 0.35;
  const angle = 20 + Math.random() * 20;
  const dist = 300 + Math.random() * 250;
  const dur = 900 + Math.random() * 500;
  el.style.left = startX + "px";
  el.style.top = startY + "px";
  el.style.transition = `transform ${dur}ms linear, opacity ${dur}ms linear`;
  document.body.appendChild(el);
  requestAnimationFrame(() => {
    const rad = (angle * Math.PI) / 180;
    const dx = Math.cos(rad) * dist;
    const dy = Math.sin(rad) * dist;
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    el.style.opacity = "0";
  });
  setTimeout(() => el.remove(), dur + 80);
}
function shootingStarLoop() {
  spawnShootingStar();
  const next = 4500 + Math.random() * 5500;
  setTimeout(shootingStarLoop, next);
}

/* ====================================================================
   4. CURSOR GLOW & RIPPLE
   ==================================================================== */
function setupCursorAndRipple() {
  const glow = $("cursor-glow");
  let active = false;
  window.addEventListener("mousemove", (e) => {
    glow.style.left = e.clientX + "px";
    glow.style.top = e.clientY + "px";
    if (!active) { glow.style.opacity = "1"; active = true; }
  });
  window.addEventListener("mouseleave", () => { glow.style.opacity = "0"; active = false; });

  window.addEventListener("pointerdown", (e) => {
    const r = document.createElement("div");
    r.className = "ripple";
    r.style.left = e.clientX + "px";
    r.style.top = e.clientY + "px";
    $("ripple-layer").appendChild(r);
    setTimeout(() => r.remove(), 950);
  });
}

/* ====================================================================
   5. SKY LAYER — generate posisi bintang & ikon kenangan
   ==================================================================== */
function generatePositions(starCount, heartCount) {
  const cols = 7, rows = 6;
  const cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) cells.push({ r, c });
  }
  // shuffle
  for (let i = cells.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }
  const toPercent = (cell) => {
    const jitterX = (Math.random() * 8 - 4);
    const jitterY = (Math.random() * 6 - 3);
    const x = ((cell.c + 0.5) / cols) * 100 + jitterX;
    const y = 8 + ((cell.r + 0.5) / rows) * 78 + jitterY;
    return {
      x: Math.min(96, Math.max(4, x)),
      y: Math.min(88, Math.max(8, y))
    };
  };
  const starCells = cells.slice(0, starCount).map(toPercent);
  const heartCells = cells.slice(starCount, starCount + heartCount).map(toPercent);
  return { starCells, heartCells };
}

function buildSkyLayer() {
  const layer = $("sky-layer");
  const { starCells, heartCells } = generatePositions(totalStars, totalHearts);

  starCells.forEach((pos, i) => {
    const el = document.createElement("div");
    el.className = "star-pt";
    el.style.left = pos.x + "vw";
    el.style.top = pos.y + "vh";
    el.style.animationDelay = (Math.random() * 2) + "s";
    el.dataset.index = i;
    el.addEventListener("click", (e) => openStar(i, el, e));
    layer.appendChild(el);
  });

  heartCells.forEach((pos, i) => {
    const el = document.createElement("div");
    el.className = "heart-pt";
    el.textContent = "💝";
    el.style.left = pos.x + "vw";
    el.style.top = pos.y + "vh";
    el.style.animationDelay = (Math.random() * 3) + "s, " + (Math.random() * 4) + "s";
    el.dataset.index = i;
    el.addEventListener("click", (e) => openHeart(i, el, e));
    layer.appendChild(el);
  });
}

/* glow burst di posisi bintang yang baru dibuka */
function spawnGlowBurst(targetEl) {
  const rect = targetEl.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "glow-burst";
  el.style.left = rect.left + rect.width / 2 + "px";
  el.style.top = rect.top + rect.height / 2 + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 750);
}

/* ====================================================================
   6. PROGRESS BAR
   ==================================================================== */
function updateProgress() {
  $("star-progress").textContent = `${openedStars.size} / ${totalStars}`;
  $("heart-progress").textContent = `${openedHearts.size} / ${totalHearts}`;
}

/* ====================================================================
   7. NARASI — sequence text helper
   ==================================================================== */
function playSequence(lines, opts = {}) {
  const lineDuration = opts.lineDuration || 2200;
  const fadeDuration = opts.fadeDuration || 650;
  const holdLast = !!opts.holdLast;
  const el = $("sequence-text");

  return (async () => {
    for (let i = 0; i < lines.length; i++) {
      el.style.transition = "none";
      el.style.opacity = "0";
      el.innerHTML = lines[i];
      void el.offsetWidth; // force reflow
      el.style.transition = `opacity ${fadeDuration}ms ease`;
      el.style.opacity = "1";
      await wait(lineDuration);
      const isLast = i === lines.length - 1;
      if (!(isLast && holdLast)) {
        el.style.opacity = "0";
        await wait(fadeDuration);
      }
    }
  })();
}

function waitForClick(el) {
  return new Promise((resolve) => {
    const handler = () => { el.removeEventListener("click", handler); resolve(); };
    el.addEventListener("click", handler);
  });
}

/* ====================================================================
   8. OPENING & INTRO FLOW
   ==================================================================== */
async function runOpening() {
  await playSequence(["Hai.", "Aku punya sesuatu...", "...tapi kali ini bukan lewat chat."]);
  $("start-btn").classList.add("visible");
  await waitForClick($("start-btn"));
  $("start-btn").classList.remove("visible");
  await runIntro();
}

async function runIntro() {
  await playSequence([
    "Katanya...",
    "Kalau kita melihat langit cukup lama...",
    "Kadang kita menemukan sesuatu yang berharga."
  ]);
  await playSequence(["Coba klik bintang-bintang yang bersinar."], { lineDuration: 2600 });
  enterMainStage();
}

function enterMainStage() {
  $("overlay-scrim").classList.add("hidden");
  $("sky-layer").classList.add("interactive");
  $("progress-bar").classList.add("visible");
  const hint = $("hint-text");
  hint.textContent = "Sentuh bintang ✨ dan ikon 💝 yang kau temukan di langit";
  hint.classList.add("visible");
  setTimeout(() => hint.classList.remove("visible"), 5200);
}

/* ====================================================================
   9. STAR INTERACTION
   ==================================================================== */
function openStar(index, el) {
  if (openedStars.has(index)) return;
  openedStars.add(index);
  el.classList.add("opened");
  spawnGlowBurst(el);
  updateProgress();
  showMessageCard(STAR_MESSAGES[index]);
}

function showMessageCard(lines) {
  const wrap = $("message-lines");
  wrap.innerHTML = "";
  lines.forEach((line, i) => {
    const p = document.createElement("p");
    p.textContent = line;
    p.style.animationDelay = (i * 0.25) + "s";
    wrap.appendChild(p);
  });
  $("card-message").classList.add("visible");
}

function closeMessageCard() {
  $("card-message").classList.remove("visible");
  if (openedStars.size === totalStars && !endingTriggered) {
    endingTriggered = true;
    setTimeout(() => queueSequence(triggerEnding), 900);
  }
}
$("close-message").addEventListener("click", closeMessageCard);
$("card-message").addEventListener("click", (e) => {
  if (e.target.id === "card-message") closeMessageCard();
});

/* ====================================================================
   10. HEART / MEMORY INTERACTION
   ==================================================================== */
function openHeart(index, el) {
  if (openedHearts.has(index)) return;
  openedHearts.add(index);
  el.classList.add("opened");
  updateProgress();
  showPolaroid(memories[index]);
}

function showPolaroid(memory) {
  const wrap = $("photo-wrap");
  wrap.innerHTML = "";
  const img = document.createElement("img");
  img.src = memory.image;
  img.alt = "kenangan";
  img.onerror = () => { wrap.innerHTML = "📷"; };
  wrap.appendChild(img);
  $("photo-caption").textContent = memory.caption;
  $("card-polaroid").classList.add("visible");
}

function closePolaroid() {
  $("card-polaroid").classList.remove("visible");
  if (openedHearts.size === totalHearts && !heartsSequenceShown) {
    heartsSequenceShown = true;
    setTimeout(() => queueSequence(triggerHeartsSequence), 900);
  }
}
$("close-photo").addEventListener("click", closePolaroid);
$("card-polaroid").addEventListener("click", (e) => {
  if (e.target.id === "card-polaroid") closePolaroid();
});

/* ====================================================================
   11. SEQUENCE QUEUE (mencegah dua narasi tampil bersamaan)
   ==================================================================== */
function queueSequence(fn) {
  sequenceQueue = sequenceQueue.then(fn).catch((err) => console.error(err));
}

/* ====================================================================
   12. KENANGAN SELESAI — narasi singkat lalu kembali ke langit
   ==================================================================== */
async function triggerHeartsSequence() {
  $("overlay-scrim").classList.remove("hidden");
  await wait(300);
  await playSequence(["Setiap foto hanya menyimpan beberapa detik."]);
  await playSequence(["Tapi kenangannya bisa bertahan jauh lebih lama."]);
  if (!endingTriggered || $("sunrise-overlay").classList.contains("visible") === false) {
    // hanya tutup scrim jika cerita ending belum / belum mengambil alih
    if (!document.body.classList.contains("ending-stage")) {
      $("overlay-scrim").classList.add("hidden");
    }
  }
}

/* ====================================================================
   13. ENDING SEQUENCE
   ==================================================================== */
function spawnBirds() {
  for (let i = 0; i < 4; i++) {
    setTimeout(() => {
      const b = document.createElement("div");
      b.className = "bird";
      b.textContent = "🕊";
      b.style.top = (10 + Math.random() * 25) + "vh";
      b.style.animationDuration = (9 + Math.random() * 4) + "s";
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 14000);
    }, i * 900);
  }
}

async function triggerEnding() {
  document.body.classList.add("ending-stage");
  $("sky-layer").classList.remove("interactive");
  $("hint-text").classList.remove("visible");
  $("overlay-scrim").classList.remove("hidden");

  await wait(300);
  await playSequence(["Ternyata...", "Yang paling ingin aku sampaikan..."]);
  await playSequence(["Lain kali kalau kita sama-sama sedang sibuk...", "Semoga kita tetap saling mendoakan."]);
  await playSequence(["Karena nggak semua rasa harus selalu diucapkan."]);
  await playSequence(["Kadang...", "Cukup disimpan baik-baik."]);

  // transisi langit menuju subuh
  $("sunrise-overlay").classList.add("visible");
  spawnBirds();
  particleBurst(40);
  await wait(2600);

  await playSequence(["Terima kasih...", "Sudah menjadi salah satu alasan aku tersenyum."]);
  await playSequence(["Jaga diri baik-baik ya."]);
  await playSequence(["Sampai bertemu lagi, di waktu yang lebih baik."], { lineDuration: 3200, holdLast: true });

  $("overlay-scrim").classList.add("hidden");
  $("final-icon").classList.add("visible");
}

/* tombol akhir 🤍 */
$("final-icon").addEventListener("click", () => {
  particleBurst(140);
  $("final-icon").style.pointerEvents = "none";
});

/* ====================================================================
   14. INIT
   ==================================================================== */
window.addEventListener("load", () => {
  updateProgress();
  setupCanvasStars();
  setupParticles();
  setupCursorAndRipple();
  buildSkyLayer();
  shootingStarLoop();
  runOpening();
});
</script>
